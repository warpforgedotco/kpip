[project]
name = "kpip"
version = "0.0.1"
description = "Pip Reimagined for Performance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
authors = [
    { name = "Kevin Turcios", email = "turcioskevinr@gmail.com" },
]

requires-python = ">=3.14"
dependencies = []

[project.scripts]
kpip = "kpip._internal.cli.main:main"

[project.urls]
Homepage = "https://github.com/warpforgedotco/kpip"
Documentation = "https://github.com/warpforgedotco/kpip#readme"
Source = "https://github.com/warpforgedotco/kpip"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
benchmark = ["pytest-codspeed>=5.0.3", "pytest-benchmark>=5", "uv==0.12.1"]
crosshair = ["crosshair-tool", "hypothesis-crosshair"]
typing = ["ruff", "ty", "typing-extensions==4.16.0"]
# pip's own test group, from the pyproject.toml of the commit in
# tools/vendoring/pip-upstream.txt.
test = [
    "cryptography",
    "flit-core >= 3.11, < 5",
    "freezegun",
    "installer",
    "pytest >= 7.0",
    "pytest-cov",
    "pytest-rerunfailures",
    "pytest-xdist",
    "pytest-subket",
    "scripttest",
    "setuptools",
    "virtualenv >= 20.0.28",
    "werkzeug",
    "tomli-w",
    "proxy.py",
]

[tool.uv]
default-groups = ["typing"]

[tool.uv.build-backend]
module-name = "kpip"

[tool.ruff]
# src/kpip and tests are upstream pip, generated by scripts/vendor_pip.py.
extend-exclude = ["src/kpip", "tests"]

[tool.ruff.lint]
# TC004: catches a real bug class -- a name imported only under
# TYPE_CHECKING but referenced at runtime raises NameError, and neither
# mypy nor ruff's default F821 catch it (both treat TYPE_CHECKING blocks
# as reachable for name resolution).
# The rules are listed rather than left to ruff's defaults, which change
# between releases.
select = ["E4", "E7", "E9", "F", "TC004"]

[tool.pytest.ini_options]
# pip's own configuration, for its vendored test suite.
addopts = [
    "-r=aR",
    "--color=yes",
    "--ignore=src/kpip/_vendor",
    "--ignore=tests/tests_cache",
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=localhost",
]
xfail_strict = true
markers = [
    "network: tests that need network",
    "incompatible_with_sysconfig",
    "incompatible_with_venv",
    "no_auto_tempdir_manager",
    "unit: unit tests",
    "integration: integration tests",
    "bzr: VCS: Bazaar",
    "svn: VCS: Subversion",
    "mercurial: VCS: Mercurial",
    "git: VCS: git",
    "search: tests for 'pip search'",
]
filterwarnings = [
    "error::kpip._internal.utils.deprecation.PipDeprecationWarning:",
]

[tool.ty.src]
# Generated from upstream pip by scripts/vendor_pip.py.
exclude = ["src/kpip/**", "tests/**"]

[tool.ty.environment]
python-version = "3.14"
