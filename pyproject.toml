[project]
name = "kpip"
# Bump with `uv run scripts/bump_version.py --bump patch`; it syncs __version__.
version = "0.0.1"
description = "Pip Reimagined for Performance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
authors = [
    { name = "Kevin Turcios", email = "turcioskevinr@gmail.com" },
]

# NOTE: requires-python is duplicated in __kpip-runner__.py.
# When changing this value, please change the other copy as well.
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kpip = "kpip.cli.entrypoint:main"

[project.urls]
Homepage = "https://github.com/warpforgedotco/kpip"
Documentation = "https://github.com/warpforgedotco/kpip#readme"
Source = "https://github.com/warpforgedotco/kpip"

[build-system]
requires = []
build-backend = "kpip.build.build_backend"
backend-path = ["src"]

[dependency-groups]
benchmark = ["pytest-codspeed>=5.0.3", "pytest-benchmark>=5", "tomli>=2", "uv==0.12.1"]
typing = ["ruff", "ty", "typing-extensions==4.16.0"]
vendoring = ["vendoring==1.4.0; python_version >= '3.11'"]
test = [
    "cryptography",
    "filelock",
    "installer",
    "keyring",
    "msgpack",
    "packaging",
    "proxy.py",
    "pyproject-hooks",
    "pytest",
    "pytest-cov",
    "pytest-rerunfailures",
    "pytest-subket",
    "pytest-xdist>=3.8.0",
    "scripttest",
    "tomli-w",
    "tomli",
    "uv",
    "uv-build",
    "virtualenv",
    "werkzeug",
]

[tool.uv]
default-groups = ["typing"]

[tool.uv.build-backend]
module-name = "kpip"

[tool.kpip.build-backend]
sdist-exclude = ["tests/cli/data/**"]

[tool.vendoring]
destination = "src/kpip/_vendor/"
requirements = "src/kpip/_vendor/vendor.txt"
namespace = "kpip._vendor"
protected-files = ["VENDORED.md", "vendor.txt"]
patches-dir = "tools/vendoring/patches"

[tool.vendoring.license.directories]
# Git source archives retain the distribution's hyphenated name.
nab-resolver = "nab_resolver"

[tool.vendoring.transformations]
substitute = [
    { match = "(?m)^import urllib3\\.connection$", replace = "from urllib3 import connection" },
    { match = "import urllib3\\.contrib\\.pyopenssl", replace = "from urllib3.contrib import pyopenssl" },
    { match = "Defaults for the six provider methods", replace = "Defaults for the seven provider methods" },
    { match = "``receive_partial_solution_hint``, ``consume_pending_clauses``", replace = "``consume_priority_invalidations``, ``receive_partial_solution_hint``,\\n    ``consume_pending_clauses``" },
    { match = "``narrow_for_display``, the six", replace = "``narrow_for_display``, the" },
]
drop = [
    "*.dist-info/",
    "bin/",
    "certifi/tests/",
    "**/__pycache__/",
    "**/*.pyc",
]

[tool.ruff]
extend-exclude = ["tests/cli/data", "src/kpip/_vendor"]

[tool.ruff.lint]
# TC004: catches a real bug class -- a name imported only under
# TYPE_CHECKING but referenced at runtime raises NameError, and neither
# mypy nor ruff's default F821 catch it (both treat TYPE_CHECKING blocks
# as reachable for name resolution).
extend-select = ["TC004"]

[tool.pytest.ini_options]
pythonpath = ["scripts/benchmark/src"]
markers = [
    "bzr: tests requiring Bazaar",
    "enable_socket: allow network access for this test",
    "git: tests requiring Git",
    "incompatible_with_venv: tests incompatible with the venv test mode",
    "integration: integration test",
    "mercurial: tests requiring Mercurial",
    "network: test requiring network access",
    "search: kpip search test",
    "svn: tests requiring Subversion",
    "unit: unit test",
]

[tool.ty.src]
exclude = ["src/kpip/_vendor/**"]

[tool.ty.environment]
python-version = "3.14"
