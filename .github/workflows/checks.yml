name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep failures readable: pytest's own progress output is enough, and a
  # traceback per failure beats a screenful of locals.
  PYTEST_ADDOPTS: "--color=yes -q --tb=short"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          # 3.15 is published as a release candidate until its final release.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # Type checking traverses optional integrations that are exercised by
      # the test suite, so make their importable packages available too.
      - run: uv sync --locked --group typing --group test
      - name: ruff check
        run: uv run ruff check src tests conftest.py
      - name: ruff format
        run: uv run ruff format --check src tests conftest.py
      - name: ty
        run: uv run ty check src

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # uv rather than setup-python: it is the only one of the two that
      # publishes a 3.15 build, and 3.15 is where argparse changed enough
      # to break a help page the other versions printed fine.
      - run: uv python install ${{ matrix.python-version }}
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install --yes subversion
      - run: uv sync --locked --group test --python ${{ matrix.python-version }}
      - name: Unit and package tests
        # Excludes tests/cli/functional, which drives a real kpip in a
        # subprocess and runs in its own job below. Network-marked tests are
        # deselected here so a slow index cannot fail an unrelated pull
        # request; the functional job covers what needs the network.
        run: >
          uv run --python ${{ matrix.python-version }} pytest tests
          --ignore=tests/cli/functional
          --ignore=tests/benchmarks
          -m "not network"
          -p no:randomly

  windows-clone:
    name: Clone / Windows
    # The suite runs on Linux; the hard link loops, in Python and in the C
    # compiled into the binary (src/kpip/host/_accel/_kpip_link_tree.c),
    # take the whole-tree route on Windows too, so they are tested there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # cl on PATH, which the tests build the C loops with.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - run: uv python install 3.15
      - run: uv sync --locked --group test --python 3.15
      - name: Clone tests
        run: uv run --python 3.15 pytest tests/platform/test_clone_fallbacks.py -p no:randomly -rs

  functional:
    name: Functional / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum, the newest release, and the newest pre-release: a
        # real kpip in a subprocess is what notices an interpreter change
        # the unit tests import their way around.
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # uv rather than setup-python: it is the only one of the two that
      # publishes a 3.15 build, and 3.15 is where argparse changed enough
      # to break a help page the other versions printed fine.
      - run: uv python install ${{ matrix.python-version }}
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install --yes subversion
      - run: uv sync --locked --group test --python ${{ matrix.python-version }}
      - name: Functional tests
        run: >
          uv run --python ${{ matrix.python-version }}
          pytest tests/cli/functional -n auto
