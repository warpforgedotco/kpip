name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep failures readable: pytest's own progress output is enough, and a
  # traceback per failure beats a screenful of locals.
  PYTEST_ADDOPTS: "--color=yes -q --tb=short"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          # 3.15 is published as a release candidate until its final release.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # Type checking traverses optional integrations that are exercised by
      # the test suite, so make their importable packages available too.
      - run: uv sync --locked --group typing --group test --group benchmark
      # src/kpip and tests are upstream pip's, generated by the script.
      - name: ruff check
        run: uv run ruff check scripts/vendor_pip.py benchmarks
      - name: ruff format
        run: uv run ruff format --check scripts/vendor_pip.py benchmarks
      - name: ty
        run: uv run ty check scripts/vendor_pip.py benchmarks

  vendored-pip:
    name: Vendored pip is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # Regenerates src/kpip and tests from tools/vendoring/pip-upstream.txt
      # and the patches, and fails if the committed trees differ.
      - run: uv run --no-project scripts/vendor_pip.py check

  tests:
    name: Tests / Python ${{ matrix.python-version }} / ${{ matrix.solver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]
        # pip's resolvelib, and nab-resolver (--use-feature=nab-resolver),
        # which must give the same answers.
        solver: ["resolvelib", "nab"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # uv rather than setup-python: it is the only one of the two that
      # publishes a 3.15 build, and 3.15 is where argparse changed enough
      # to break a help page the other versions printed fine.
      - run: uv python install ${{ matrix.python-version }}
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install --yes subversion
      - run: uv sync --locked --group test --python ${{ matrix.python-version }}
      - name: Unit tests
        env:
          PIP_USE_FEATURE: ${{ matrix.solver == 'nab' && 'nab-resolver' || '' }}
        run: >
          uv run --python ${{ matrix.python-version }} pytest tests/unit
          -n auto
          -m "not network"

  functional:
    name: Functional / Python ${{ matrix.python-version }} / ${{ matrix.solver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]
        solver: ["resolvelib", "nab"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Install Subversion and Mercurial
        run: sudo apt-get update && sudo apt-get install --yes subversion mercurial
      - run: uv sync --locked --group test --python ${{ matrix.python-version }}
      - name: Common wheels
        # The wheels the tests install into their environments, built by kpip.
        run: >
          uv run --python ${{ matrix.python-version }} python -m kpip wheel
          --quiet -w tests/data/common_wheels --group test-common-wheels
      - name: Functional tests
        # pip's functional tests, each running kpip in an environment of its
        # own. Network-marked ones are left out, so a slow index cannot fail
        # an unrelated pull request.
        env:
          PIP_USE_FEATURE: ${{ matrix.solver == 'nab' && 'nab-resolver' || '' }}
        run: >
          uv run --python ${{ matrix.python-version }} pytest tests/functional
          -n auto
          -m "not network"

