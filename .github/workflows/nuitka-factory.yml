name: Nuitka factory

# Nuitka stages its work on factory before it reaches develop, which
# kpip-compile follows. This tries kpip's patches on factory every day, so a
# patch that will stop applying, or that upstream is about to take, shows
# days before develop breaks the compile. It only reports: factory is
# rewritten as Nuitka reworks it, so a conflict there is a warning, never a
# failed run or an issue.

on:
  pull_request:
    paths:
      - "scripts/compile/src/kpip_compile/**"
      - "tools/vendoring/patches/nuitka/**"
      - ".github/workflows/nuitka-factory.yml"
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patches:
    name: Patches on Nuitka factory
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: scripts/compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/compile/uv.lock
      - name: Try each patch
        run: |
          status=0
          uv run kpip-compile check-patches --branch factory > report.md || status=$?
          cat report.md
          {
            cat report.md
            echo
            echo "Only an identical change counts as already upstream: a patch that factory has rewritten in its own way shows as a conflict."
          } >> "$GITHUB_STEP_SUMMARY"
          # One annotation per patch that needs a look; the run still passes.
          # The backticks are the table's own, matched literally.
          # shellcheck disable=SC2016
          sed -nE 's/^\| `([^`]+)` \| (conflicts|already upstream) \|$/\1: \2/p' report.md |
            while read -r line; do
              echo "::warning title=Nuitka factory::$line on factory"
            done
          # Anything but "a patch does not apply" is a broken check.
          [ "$status" -le 1 ]
