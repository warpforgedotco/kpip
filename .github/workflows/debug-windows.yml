name: Debug Windows cached lock

on:
  push:
    branches: [debug/windows-cached-lock-2]

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - name: Pure Python, no cache
        run: |
          uv run python -m kpip lock --no-cache-dir --output "$RUNNER_TEMP/n.toml" requests && grep -c '^name' "$RUNNER_TEMP/n.toml" || true
      - name: Pure Python, cold cache
        run: uv run python scripts/debug/trace_lock.py "$RUNNER_TEMP/p" "$RUNNER_TEMP/p.toml" requests || true
      - name: Pure Python, warm cache
        run: uv run python scripts/debug/trace_lock.py "$RUNNER_TEMP/p" "$RUNNER_TEMP/p2.toml" requests || true
      - name: Build the compiled modules
        run: uv run --project scripts/compile --locked --python "${{ steps.python.outputs.python-path }}" kpip-compile extensions || true
      - name: Compiled modules, cold cache
        run: uv run python scripts/debug/trace_lock.py "$RUNNER_TEMP/c" "$RUNNER_TEMP/c.toml" requests || true
      - name: Compiled modules, warm cache
        run: uv run python scripts/debug/trace_lock.py "$RUNNER_TEMP/c" "$RUNNER_TEMP/c2.toml" requests || true
      - name: Cache contents
        run: find "$RUNNER_TEMP/c" -maxdepth 4 | head -40 || true
