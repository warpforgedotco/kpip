name: CrossHair

# The property tests in tests/properties run with Hypothesis's own backend on
# every pull request, as part of Checks. Here CrossHair searches the same
# properties symbolically, for the inputs random generation rarely reaches.
# That search is far slower per example, so it runs nightly rather than
# holding up a pull request.
#
# A path that times out or behaves nondeterministically is discarded rather
# than reported, but a red run is not always a counterexample: the step can
# also time out, CrossHair or z3 can fail, or a Hypothesis health check can
# fire. A failure on main is posted to one open tracking issue, saying which
# of the two it looks like, with the run's pytest output attached.
#
# The search is not exhaustive and nothing is kept between runs, so a
# counterexample found one night may not be found the next. Commit it as an
# ``@example(...)`` on the property, or as a regression test, before fixing
# the bug: from then on every pull request checks it.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crosshair:
    name: Symbolic properties / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # 3.14 rather than the newest pre-release: CrossHair's 3.15 support is
      # still landing, and a symbolic engine tracks interpreter internals.
      - run: uv python install 3.14
      - run: uv sync --locked --group test --group crosshair --python 3.14
      - name: Property tests under CrossHair
        # Inside the job's limit, so a slow night fails this step and the
        # reporting steps below still run; a cancelled job runs none of them.
        timeout-minutes: 50
        env:
          PYTEST_ADDOPTS: "-q --tb=short --color=no"
        run: |
          set -o pipefail
          uv run --python 3.14 pytest tests/properties \
            --hypothesis-profile=crosshair \
            -p no:randomly \
            -n auto 2>&1 | tee crosshair.log
      - name: Keep the pytest output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crosshair-log
          path: crosshair.log
          if-no-files-found: ignore
          retention-days: 90
      - name: Report on the tracking issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CrossHair nightly: property tests failing"
          if grep -q "Falsifying example" crosshair.log 2>/dev/null; then
            summary="CrossHair found a counterexample."
            details=$(grep -B2 -A15 "Falsifying example" crosshair.log | head -120)
          else
            summary="The run failed without a counterexample: a timeout, a CrossHair or z3 error, a Hypothesis health check, or setup. Check the log before treating it as a bug."
            details=$(tail -60 crosshair.log 2>/dev/null || echo "No pytest output was captured.")
          fi
          # The backticks are Markdown, meant literally.
          # shellcheck disable=SC2016
          body=$(printf '%s\n\nRun: %s (the full pytest output is attached to it as crosshair-log)\n\n```\n%s\n```\n\nBefore fixing a counterexample, commit it as an `@example(...)` on the property or as a regression test, so every pull request checks it. Close this issue once the nightly run is green again.\n' "$summary" "$RUN_URL" "$details")
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
