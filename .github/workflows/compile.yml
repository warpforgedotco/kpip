name: Compile

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "scripts/compile/**"
      - "tools/vendoring/patches/nuitka/**"
      # Decides the line endings the patches are checked out with.
      - ".gitattributes"
      - ".github/workflows/compile.yml"
  schedule:
    # kpip-compile follows Nuitka's develop, which moves on its own; this
    # catches a patch that stopped applying without a kpip change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: scripts/compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The binary embeds the Python it is compiled with.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/compile/uv.lock
      - name: Install patchelf
        # Nuitka needs it to point the standalone binary at its own libraries.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes patchelf
      - run: uv sync --locked --group tests --python "${{ steps.python.outputs.python-path }}"
      - name: Unit tests
        run: uv run --group tests pytest
      - name: Compile
        run: uv run kpip-compile build
      - name: Smoke test
        run: |
          # Where Nuitka's {CACHE_DIR} points on each system.
          kpip=build/kpip
          cache=${XDG_CACHE_HOME:-$HOME/.cache}/kpip-onefile
          if [ "$RUNNER_OS" = Windows ]; then
            kpip=build/kpip.exe
            cache=$(cygpath "$LOCALAPPDATA")/kpip-onefile
          fi

          # The first run unpacks and leaves the cache manifest; the second
          # starts from it without unpacking.
          "$kpip" --version
          find "$cache" -maxdepth 2 -name .nuitka-onefile-manifest | grep .
          "$kpip" --version

          # Commands load by module name, and HTTPS needs certifi's bundle.
          "$kpip" download certifi --no-cache-dir -d "$RUNNER_TEMP/download"
          ls "$RUNNER_TEMP"/download/certifi-*.whl

          # A source-only package is built with a real Python, not the binary.
          "$kpip" lock --no-cache-dir --output "$RUNNER_TEMP/sdist.toml" atlasclient==1.0.0
          grep -q 'name = "atlasclient"' "$RUNNER_TEMP/sdist.toml"

          # A build that fails reaches the user as kpip reports it, rather
          # than being taken for "no dependencies" or lost in a SystemError.
          if KPIP_BUILD_PYTHON=/nonexistent/python "$kpip" lock --no-cache-dir \
              --output "$RUNNER_TEMP/failed.toml" atlasclient==1.0.0 2> "$RUNNER_TEMP/failed.err"; then
            echo "a lock whose only sdist cannot be built succeeded"
            exit 1
          fi
          cat "$RUNNER_TEMP/failed.err"
          grep -q "Failed to build 'atlasclient'" "$RUNNER_TEMP/failed.err"
          if grep -q "SystemError" "$RUNNER_TEMP/failed.err"; then
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kpip-${{ runner.os }}
          path: |
            scripts/compile/build/kpip
            scripts/compile/build/kpip.exe
          if-no-files-found: error
