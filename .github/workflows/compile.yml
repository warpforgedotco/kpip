name: Compile

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "scripts/compile/**"
      - "tools/vendoring/patches/nuitka/**"
      # Decides the line endings the patches are checked out with.
      - ".gitattributes"
      - ".github/workflows/compile.yml"
  schedule:
    # kpip-compile follows Nuitka's develop, which moves on its own; this
    # catches a patch that stopped applying without a kpip change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: scripts/compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The binary embeds the Python it is compiled with.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.15"
          # 3.15 is published as a release candidate until its final release.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/compile/uv.lock
      - name: Install patchelf
        # Nuitka needs it to point the standalone binary at its own libraries.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes patchelf
      - run: uv sync --locked --group tests --python "${{ steps.python.outputs.python-path }}"
      - name: Unit tests
        run: uv run --group tests pytest
      - name: Compile
        run: uv run kpip-compile build
      - name: Subinterpreters beside compiled code
        # Compiles small programs with the Nuitka the build just vendored, to
        # check kpip's patches keep them safe beside subinterpreters.
        if: runner.os == 'Linux'
        env:
          KPIP_NUITKA_TESTS: "1"
        run: uv run --group tests pytest tests/test_nuitka_subinterpreters.py
      - name: Compiled code shared by threads
        # Races threads through a program compiled with the same Nuitka: with
        # the GIL, it checks what applies to both builds (patch 0015).
        if: runner.os == 'Linux'
        env:
          KPIP_NUITKA_TESTS: "1"
        run: uv run --group tests pytest tests/test_nuitka_threads.py
      - name: Smoke test
        run: |
          # Where Nuitka's {CACHE_DIR} points on each system.
          kpip=build/kpip
          cache=${XDG_CACHE_HOME:-$HOME/.cache}/kpip-onefile
          if [ "$RUNNER_OS" = Windows ]; then
            kpip=build/kpip.exe
            cache=$(cygpath "$LOCALAPPDATA")/kpip-onefile
          fi

          # The first run unpacks and leaves the cache manifest; the second
          # starts from it without unpacking.
          "$kpip" --version
          find "$cache" -maxdepth 3 -name .nuitka-onefile-manifest | grep .
          "$kpip" --version

          # Commands load by module name, and HTTPS needs certifi's bundle.
          "$kpip" download certifi --no-cache-dir -d "$RUNNER_TEMP/download"
          ls "$RUNNER_TEMP"/download/certifi-*.whl

          # A source-only package is built with a real Python, not the binary:
          # the python3 on PATH, which the binary installs for.
          "$kpip" lock --no-cache-dir --output "$RUNNER_TEMP/sdist.toml" atlasclient==1.0.0
          grep -q 'name = "atlasclient"' "$RUNNER_TEMP/sdist.toml"

          # With no Python at all, the binary still resolves with the one it
          # bundles, and refuses to build, saying why, rather than crashing.
          env -u VIRTUAL_ENV -u CONDA_PREFIX PATH=/nonexistent "$kpip" download \
            certifi --no-cache-dir -d "$RUNNER_TEMP/no-python"
          ls "$RUNNER_TEMP"/no-python/certifi-*.whl
          if env -u VIRTUAL_ENV -u CONDA_PREFIX PATH=/nonexistent "$kpip" lock \
              --no-cache-dir --output "$RUNNER_TEMP/failed.toml" atlasclient==1.0.0 \
              2> "$RUNNER_TEMP/failed.err"; then
            echo "a lock whose only sdist cannot be built succeeded"
            exit 1
          fi
          cat "$RUNNER_TEMP/failed.err"
          grep -q "No Python interpreter to build with" "$RUNNER_TEMP/failed.err"
          if grep -q "SystemError\|Traceback" "$RUNNER_TEMP/failed.err"; then
            exit 1
          fi
      - name: Installs for another Python
        # The binary bundles 3.15 and installs for whatever Python it is
        # pointed at: its bytecode, its builds and its environment must be
        # that Python's, which no source run can show.
        run: |
          kpip=$PWD/build/kpip
          bin=bin
          if [ "$RUNNER_OS" = Windows ]; then
            kpip=$PWD/build/kpip.exe
            bin=Scripts
          fi
          envs=$RUNNER_TEMP/envs
          cache=$RUNNER_TEMP/kpip-cache
          pyc_of() { find "$1" -name "*.$2.pyc" | grep -c . || true; }

          # Bytecode is the target's own, compiled by its own interpreter.
          uv venv --quiet --python 3.12 "$envs/first"
          "$kpip" --python "$envs/first" install --cache-dir "$cache" rich
          "$envs/first/$bin/python" -c "import rich.console"
          test "$(pyc_of "$envs/first" cpython-312)" -gt 0
          test "$(pyc_of "$envs/first" cpython-315)" -eq 0

          # A warm install copies the cached bytecode, which imports without
          # being compiled again: the import rewrites no .pyc.
          uv venv --quiet --python 3.12 "$envs/warm"
          VIRTUAL_ENV=$envs/warm "$kpip" install --cache-dir "$cache" rich
          before=$(find "$envs/warm" -name '*.pyc' -exec cksum {} + | sort)
          "$envs/warm/$bin/python" -c "import rich.console, rich.markdown, rich.table"
          after=$(find "$envs/warm" -name '*.pyc' -exec cksum {} + | sort)
          test "$before" = "$after"

          # A source distribution is built in an environment for 3.12.
          "$kpip" --python "$envs/first" install --no-cache-dir --no-binary six six
          "$envs/first/$bin/python" -c "import six"

          # The active environment is the one listed.
          VIRTUAL_ENV=$envs/warm "$kpip" list | grep -q '^rich '

          # Run from PATH, --version names kpip, the pip it is built from, and
          # the Python it installs for.
          PATH=$(dirname "$kpip"):$PATH "$(basename "$kpip")" --version | tee "$RUNNER_TEMP/version.txt"
          grep -q "^kpip .* (pip .*) from " "$RUNNER_TEMP/version.txt"
          grep -q "(python 3\." "$RUNNER_TEMP/version.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kpip-${{ runner.os }}
          path: |
            scripts/compile/build/kpip
            scripts/compile/build/kpip.exe
          if-no-files-found: error

  threads-free-threaded:
    # The same program compiled for a free-threaded Python, where compiled
    # code runs on several threads at once (patch 0015).
    name: Compiled threads / free-threaded 3.15
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: scripts/compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.15t"
          # 3.15 is published as a release candidate until its final release.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/compile/uv.lock
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install --yes patchelf
      - run: uv sync --locked --group tests --python "${{ steps.python.outputs.python-path }}"
      - name: Compiled code shared by threads, without the GIL
        env:
          KPIP_NUITKA_TESTS: "1"
        run: uv run --group tests pytest tests/test_nuitka_threads.py
