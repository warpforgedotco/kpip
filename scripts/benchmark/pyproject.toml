[project]
name = "kpip-benchmark"
version = "0.0.1"
description = "Hyperfine benchmark harness for kpip"
requires-python = ">=3.10"
dependencies = [
  "pytest",
]

[project.scripts]
kpip-bench = "kpip_benchmark.cli:main"
kpip-bench-compare = "kpip_benchmark.compare:main"
kpip-bench-record = "kpip_benchmark.record:main"
kpip-bench-codspeed = "kpip_benchmark.codspeed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=."
pythonpath = ["src"]
markers = ["unit: unit test"]

[dependency-groups]
tests = [
    "pytest-xdist>=3.8.0",
]
