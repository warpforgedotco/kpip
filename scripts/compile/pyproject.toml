[project]
name = "kpip-compile"
version = "0.0.1"
description = "Compile kpip with a vendored, patched Nuitka"
requires-python = ">=3.10"
dependencies = [
  # kpip-compile extensions: Cython's pure-Python mode compiles the sources,
  # setuptools drives the C compiler.
  "cython>=3.3",
  "setuptools>=70",
  # Shipped in the binary: kpip.index.typed_pages decodes index pages with it.
  "msgspec>=0.19",
  # Onefile payload compression; 3.14 ships compression.zstd instead.
  "zstandard>=0.15; python_version < '3.14'",
]

[project.scripts]
kpip-compile = "kpip_compile.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=."
pythonpath = ["src"]

[dependency-groups]
tests = [
    "pytest",
]
